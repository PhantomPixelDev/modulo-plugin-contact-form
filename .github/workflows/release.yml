name: release

# Tag vX.Y.Z (matching plugin.json) to publish a package Modulo CMS can
# install: a zip with plugin.json at its root, plus its SHA-256. The registry
# (PhantomPixelDev/modulo-registry) records that checksum, and it is what an
# install is verified against.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches plugin.json
        id: meta
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          manifest="$(jq -r .version plugin.json)"
          slug="$(jq -r .slug plugin.json)"
          if [ "$version" != "$manifest" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match plugin.json version $manifest."
            exit 1
          fi
          echo "asset=${slug}-${version}.zip" >> "$GITHUB_OUTPUT"

      - name: Build the package
        run: |
          set -euo pipefail
          git archive --format=zip -o "${{ steps.meta.outputs.asset }}" HEAD
          sha256sum "${{ steps.meta.outputs.asset }}" > "${{ steps.meta.outputs.asset }}.sha256"
          cat "${{ steps.meta.outputs.asset }}.sha256"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.meta.outputs.asset }}" "${{ steps.meta.outputs.asset }}.sha256" \
            --title "$GITHUB_REF_NAME" --generate-notes
